[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sophia"
version = "0.0.1"
description = "OpenAI-compatible gateway over ladyol's provider pool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Morganna", email = "morganna@magick.ai"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "sse-starlette>=2.0",
    "kahndor>=0.0.1,<1.0.0",
    "subtrix>=0.0.1,<1.0.0",
    "pycurity>=0.0.1,<1.0.0",
    # Provider pool lives in ladyol — pinned to a known-good range.
    "ladyol>=0.2.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
sophia = "sophia.cli:main"

[project.urls]
Homepage = "https://www.solutionsbrewer.com/"
Repository = "https://github.com/solubrew/sophia"

[tool.hatch.build.targets.wheel]
packages = ["sophia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # Live-cluster tests that talk to the running sophia container
    # (default-deny: require `-m live_cluster` to run).
    "live_cluster: tests that hit the deployed sophia LAN cluster",
]

[tool.ruff]
line-length = 120
target-version = "py310"
