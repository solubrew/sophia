# Provider accounts for Sophia — the schema ladyol expects at
# `<agent_path>/<name>_accts.yaml`. Sophia's
# ProviderPool._initialize_pool reads this on first chat.
#
# Source of truth: ~/.senbai/senbai_accts.yaml on the host. This
# file is committed so the image ships with the account list baked
# in; the API keys themselves land in the container's PyKeyStore
# vault via the entrypoint's SOPHIA_MERGE_FROM_PYCURITY_PATH path
# (see cluster/README.md § "First-boot key injection").

provider_accts:
  "minimax-000.000.000":
    enabled: True
    provider: minimax
    name: "minimax-000.000.000"
  "minimax-000.000.001":
    enabled: True
    provider: minimax
    name: "minimax-000.000.001"
  "minimax-000.000.002":
    enabled: True
    provider: minimax
    name: "minimax-000.000.002"
  "zai-000.000.000":
    enabled: True
    provider: zai
    name: "zai-000.000.000"
  # 2026-08-29 operator directive: grok deactivated. The xai account's
  # grok-2 entry points at api.groq.com and 401s with every rotation
  # pass (wasted attempt + noisy logs). Matches the host source of
  # truth ~/.senbai/senbai_accts.yaml, which already has xai disabled.
  "xai-000.000.000":
    enabled: False
    provider: xai
    name: "xai-000.000.000"
