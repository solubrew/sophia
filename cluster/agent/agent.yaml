# agent.yaml — Sophia's provider-pool config, OVERRIDES the bundled
# ladyol defaults at /usr/local/lib/python3.12/site-packages/ladyol/
# _data_/providers.yaml. Sophia's pool.py loads this file, extracts
# the ProviderPool.providers sub-tree, and calls
# `pool.config.override({"providers": ...})` to merge it on top
# of the bundled defaults.
#
# Schema: nested dict under `ProviderPool.providers.<provider_name>`
# with these fields per ladyol's bundled providers.yaml reference:
#   enabled: True|False
#   display_name: <human-friendly name>
#   env_key: <account name in PyKeyStore>
#   base_url: <provider API endpoint>
#   is_gateway: <True|False>
#   is_local: <True|False>
#   supports_prompt_caching: <True|False>
#   models: {<model_id>: {enabled: True, capability_score: N, capabilities: [...], max_tokens: N}}

ProviderPool:
  providers:
    minimax:
      enabled: True
      display_name: "minimax"
      env_key: "minimax"
      is_gateway: True
      is_local: False
      supports_prompt_caching: False
      base_url: "https://api.minimax.io/v1"
      headers:
        Content-Type: application/json
        Authorization: "Bearer <[API_KEY]>"
      roles: [user, assistant, system]
      models:
        "minimax-m2.7":
          enabled: True
          capability_score: 10
          capabilities: [chat, code, analysis]
          max_tokens: 32768
          temperature: 0.7
          context_window: 200000
          costs_per_1k_input: 0.0002
          costs_per_1k_output: 0.0006
        "minimax-m3":
          enabled: True
          capability_score: 11
          capabilities: [chat, code, analysis, reasoning]
          max_tokens: 32768
          temperature: 0.7
          context_window: 200000
          # T-NEW-121 (2026-08-27): minimax-m3 caps response bodies
          # at ~935 bytes on this LAN gateway — the upstream returns
          # a tiny thinking fragment with no tool_call on any
          # non-trivial input, which Sophia's broken-model detection
          # then rotates around uselessly. Declare a tighter
          # ``max_input_tokens`` so the pre-flight check at the
          # gateway (sophia.pool._preflight_input_caps) can steer
          # large requests to other accounts instead.
          model_overrides:
            max_input_tokens: 16000
          costs_per_1k_input: 0.0004
          costs_per_1k_output: 0.0012

    # Note: `enabled: false` in this file does NOT prevent
    # `minimax-m2.7` from being registered in the pool — ladyol
    # loads the bundled `providers.yaml` first (which has m2.7
    # enabled), then merges this override on top. The `enabled`
    # flag is honored at entry-creation time only when the model
    # is FIRST seen in the merged config; m2.7 already exists in
    # the bundled defaults, so the override can't remove it. The
    # actual hide happens server-side in
    # `sophia.pool.SophiaPool._ensure_pool` via the `SOPHIA_HIDDEN_MODELS`
    # env var (see `sophia/pool.py`).

    zai:
      enabled: True
      display_name: "zai"
      env_key: "zai"
      is_gateway: True
      is_local: False
      supports_prompt_caching: False
      base_url: "https://api.z.ai/api/coding/paas/v4"
      headers:
        Content-Type: application/json
        Authorization: "Bearer <[API_KEY]>"
      roles: [user, assistant, system]
      models:
        "glm-4.7":
          enabled: True
          capability_score: 9
          capabilities: [chat, code]
          max_tokens: 32768
          temperature: 0.7
          context_window: 128000
        "glm-5.2":
          enabled: True
          capability_score: 10
          capabilities: [chat, code, reasoning]
          max_tokens: 32768
          temperature: 0.7
          context_window: 128000

    xai:
      enabled: True
      display_name: "xai"
      env_key: "xai"
      is_gateway: True
      is_local: False
      supports_prompt_caching: False
      base_url: "https://api.groq.com/openai/v1"
      headers:
        Content-Type: application/json
        Authorization: "Bearer <[API_KEY]>"
      roles: [user, assistant, system]
      models:
        "grok-2":
          enabled: True
          capability_score: 9
          capabilities: [chat, code, analysis]
          max_tokens: 32768
          temperature: 0.7
          context_window: 128000

    # PAYG provider (operator constraint 2026-09-07): reachable ONLY
    # via explicit model pinning (model="openai/gpt-4o" etc.) or the
    # SOPHIA_PAYG_ALLOW_IN_AUTO=1 opt-in. NEVER in sophia-auto
    # rotation — enforced by SOPHIA_PAYG_PROVIDERS=openrouter in
    # docker-compose.cluster.yml + sophia/pool.py's filter.
    openrouter:
      enabled: True
      display_name: "OpenRouter"
      env_key: "openrouter"
      is_gateway: True
      is_local: False
      supports_prompt_caching: True
      base_url: "https://openrouter.ai/api/v1"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer <[API_KEY]>"
      roles: [user, assistant, system]
      models:
        "openai/gpt-4o":
          enabled: True
          capability_score: 11
          capabilities: [chat, code, analysis, vision]
          max_tokens: 16384
          temperature: 0.7
          context_window: 128000
          costs_per_1k_input: 0.0025
          costs_per_1k_output: 0.01
        "anthropic/claude-sonnet-4.5":
          enabled: True
          capability_score: 12
          capabilities: [chat, code, analysis, reasoning]
          max_tokens: 32768
          temperature: 0.7
          context_window: 200000
          costs_per_1k_input: 0.003
          costs_per_1k_output: 0.015
        "meta-llama/llama-3.3-70b-instruct":
          enabled: True
          capability_score: 8
          capabilities: [chat, code]
          max_tokens: 32768
          temperature: 0.7
          context_window: 131072
          costs_per_1k_input: 0.0003
          costs_per_1k_output: 0.0013

    ollama:
      enabled: True
      display_name: "Local Ollama"
      env_key: ""
      is_gateway: False
      is_local: True
      base_url: "http://host.docker.internal:11434/v1"
      supports_prompt_caching: False
      headers:
        Content-Type: application/json
      roles: [user, assistant, system]
      models:
        "qwen3.5:4b":
          enabled: False
          capability_score: 7
          capabilities: [chat, code]
          max_tokens: 8192
          temperature: 0.7
          context_window: 32768
        "llama3":
          enabled: False
          capability_score: 8
          capabilities: [chat, code, analysis]
          max_tokens: 8192
          temperature: 0.7
          context_window: 8192