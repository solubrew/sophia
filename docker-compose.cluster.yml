# docker-compose.yml — Sophia cluster for end-to-end testing.
#
# Topology (this host):
#
#   open-webui (LAN:3000) ──┐
#                              ├──▶ sophia (LAN:8765) ──▶ ollama / future providers
#   senbai.service ─────────┤    ▲ (also: arthr Hermes Agent profile
#   arthr hermes ───────────┘    │  consumes the same gateway)
#                                   │
#   All consumers funnel through sophia; rotation across upstreams
#   (minimax × 3, zai, xai) happens inside sophia via the strategy
#   body field injected by each client. See cluster/README.md.
#
# Sophia uses SQLite inside the named `sophia_data` volume — one
# single SQLite file holds the requestor keys + usage log + role
# metadata. The cluster has NO postgres dependency: the bootstrap
# service that originally tried to seed a `sophia` DB on the shared
# ncho-postgres was removed after we discovered the existing
# ncho-postgres launch env carries a stale POSTGRES_PASSWORD (so any
# outside connection fails authentication). When Sophia's Postgres
# adapter lands (per HERMES_SETUP.md §5), we'll add the bootstrap
# service back + flip SOPHIA_DB to a postgres:// URL — but that's a
# separate piece of work.
#
# Patterns lifted from nchantdoffice_com/docker-compose.yml:
#   - named services + named volumes
#   - json-file log rotation (10 MB × 3)
#   - depends_on with healthchecks (when compose v2 is available)
#   - secrets via PyKeyStore, NOT env vars (the web container reads
#     vault.db at startup; never put provider API keys in .env)
#
# Run:    ./cluster/docker-compose-v2 -f docker-compose.cluster.yml up -d --build
# Stop:   ./cluster/docker-compose-v2 -f docker-compose.cluster.yml down
#
# We use docker-compose-v2 (a wrapper around the operator-installed
# Compose v2 binary at /home/solubrew/.local/bin/docker-compose-v2)
# because the host's /usr/bin/docker-compose is v1.29.2, which crashes
# against Docker Engine 29+ with `KeyError: 'ContainerConfig'`. The
# cluster/docker-compose wrapper for v1 (which monkey-patched a docker-py
# bug) is now dead code and can be deleted if nothing else references it.
# Wipe:   ./cluster/docker-compose-v2 -f docker-compose.cluster.yml down -v
#
# NB: Docker Compose v2 (v2.32.4+) is installed at
# /home/solubrew/.local/bin/docker-compose-v2. The cluster wrapper
# cluster/docker-compose-v2 just resolves to that binary, so the
# compose YAML stays portable across hosts where v2 might live in
# a different location.

services:
  sophia:
    build:
      context: .
      dockerfile: Dockerfile
      # SB_STACK_MANIFEST is the GitVein SB namespace manifest piped
      # in at build time so cluster/sb_resolve.py can mirror the
      # runtime spec_router (which reads the same file). Required
      # for the GitVein redirect to work; default empty so a fresh
      # `docker build` without the arg only installs Sophia + the
      # explicit PyPI list. Orchestrator: see cluster/README.md.
      args:
        SB_STACK_MANIFEST: "${SB_STACK_MANIFEST:-}"
    restart: unless-stopped
    environment:
      # LAN bind — exposed on the host's loopback for the test (open
      # webui + hermes both run on this host too).
      HOST: "0.0.0.0"
      PORT: "8765"
      # Sophia's SQLite DB lives on the named volume mounted at
      # /var/lib/sophia. The path matches what the Dockerfile
      # RUN mkdir'd so the sophia user (uid 1001) can write.
      SOPHIA_DB: /var/lib/sophia/sophia.db
      SOPHIA_CAPTURES_DIR: /var/lib/sophia/captures
      SOPHIA_CAPTURE_MAX_BYTES: "1073741824"   # 1 GiB
      # Provider pool: ship a small providers.yaml that points at the
      # host's local ollama (no API key needed). Override with
      # SOPHIA_PROVIDER_POOL=/path/to/your.yaml in cluster/.env when you
      # want to switch providers.
      SOPHIA_PROVIDER_POOL: /etc/sophia/agent
      # T-NEW-121: restrict sophia-auto rotation to the real upstream
      # models that have declared context windows in agent.yaml.
      # T-NEW-221 note (2026-08-29): this pin was lost from the working
      # tree during the deploy rollback/reset dance and is restored
      # here. grok-2 is deliberately NOT in the list — the xai account
      # is disabled (401s against api.groq.com).
      SOPHIA_AUTO_MODELS: "minimax-m2.7,minimax-m3,glm-4.7,glm-5.2"
      # T-NEW-221 (2026-08-28): spawn N parallel uvicorn workers so
      # multiple Hermes profiles (arthr + morganna + future) can hit
      # sophia concurrently without serializing on one event loop.
      # 429 cooldowns are backed by SQLite so all workers see the same
      # pause-until timestamps. Default is 1 (back-compat); set 4 here.
      SOPHIA_WORKERS: "4"
      SOPHIA_LOG_DIR: /var/log/sophia
    # ladyol's _initialize_pool() does:
    #   accts = kahndor.Instruct(join(self.agent_path, f"{self.name}_accts.yaml"))
    # where self.name = Path(agent_path).name.replace('.', '')
    #
    # Two quirks:
    #  1) It calls .replace('.', '') on the basename, so any dot in
    #     the basename (like a .yaml extension) becomes part of the
    #     agent name. So 'providers.yaml' would have name 'providersyaml'.
    #  2) It treats agent_path as a DIRECTORY and looks for the accts
    #     file inside it: <dir>/<name>_accts.yaml.
    #
    # Resolution: ship agent_path as a DIRECTORY named 'agent'
    # (no dot in basename, so name = 'agent'), and put the accts
    # file inside it at agent_accts.yaml. So the in-image layout is:
    #   /etc/sophia/agent/                    ← agent_path (dir)
    #     agent.yaml   (not read by ladyol but useful for humans)
    #     agent_accts.yaml                    ← what ladyol reads
    # NB: the bundle ALSO includes agent.yaml as documentation; it's
    # not consulted by ladyol but the operator can cp it out for
    # inspection. We use the SOPHIA_PROVIDER_POOL dir to also host
    # any future per-deployment overlays (env keys, model overrides).
    volumes:
      - sophia_data:/var/lib/sophia
      # Bind-mount the local sb-dist wheels so the Dockerfile can
      # COPY them in. Read-only is fine — the container never writes
      # back to the host checkout.
      - ./sb-dist:/opt/sophia/sb-dist:ro
      # Bind-mount the host PyKeyStore vault directory at
      # /host-pycurity (read-only) so the container's entrypoint
      # can read the source vault during the merge step. The host
      # vault is typically at ~/.local/share/pycurity/ (operator's
      # default). Operators on a non-default host vault layout can
      # override this bind with a custom compose file (see
      # docs/DEPLOY.md "Custom host vault layout"). If this bind
      # doesn't exist on a given host (e.g., the operator doesn't
      # run a host-wide PyKeyStore), the entrypoint's merge step
      # gracefully no-ops and the container starts in cold mode.
      # T-NEW-119 followup: this bind is the foundation of the
      # idempotent recovery flow — seed-keys.sh always passes
      # SOPHIA_CLUSTER_MASTER_PASSPHRASE on every restart so the
      # entrypoint can re-unlock an existing vault whose temp.key
      # has expired without operator intervention.
      #
      # NB: We hardcode /home/solubrew/.local/share/pycurity/ here
      # instead of using ${HOME} because v1 docker-compose (which
      # is what this cluster runs) does NOT expand environment
      # variables inside bind-mount source paths. PYCURITY_HOST_DIR
      # is still honoured as a literal override for non-default
      # operator layouts — set it in cluster/.env or pass via the
      # shell:  PYCURITY_HOST_DIR=/path/to/vault docker-compose up.
      # Named volume for rotating logs — lives on the Docker local filesystem
      # (/var/lib/docker/volumes/sophia_logs/) so the sophia user (uid 1001)
      # can always write without NFS permission constraints. A post-deploy
      # sync script (scripts/sync-sophia-logs.sh) mirrors files to the
      # host NFS share at /home/solubrew/EDN/Downloads/LOGs/sophia.
      - sophia_logs:/var/log/sophia
      - ${PYCURITY_HOST_DIR:-/home/solubrew/.local/share/pycurity}:/host-pycurity:ro
    ports:
      - "8765:8765"   # bound to 0.0.0.0 — accessible from the LAN.
                      # The container still listens on its loopback
                      # too, so the healthcheck (http://127.0.0.1:8765/healthz)
                      # works from within the same container.
    # Stable network alias so the WebUI container can reach sophia by
    # a fixed hostname regardless of the underlying container name
    # (v1 compose names it sophia_sophia_1, v2 names it sophia-sophia-1;
    # both metrics and the open-webui OPENAI_API_BASE_URL point at
    # 'sophia' on this network). Without this alias, switching
    # compose versions breaks open-webui's connection.
    networks:
      default:
        aliases:
          - sophia
          - sophia_sophia_1
    healthcheck:
      # /healthz is the FastAPI health endpoint (no auth required).
      # Single-shot urllib probe — no extra packages needed.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8765/healthz',timeout=2); sys.exit(0 if r.status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  open-webui:
    # Official image — Open WebUI speaks OpenAI-compatible /v1 since
    # 0.4.x, so pointing it at sophia needs only the URL + a Bearer key.
    image: ghcr.io/open-webui/open-webui:main
    # Stable network alias so hermes (when configured to use a
    # docker-network hostname instead of 192.168.1.67) can reach
    # open-webui by a fixed name.
    networks:
      default:
        aliases:
          - open-webui
          - open_webui_1
    restart: unless-stopped
    depends_on:
      - sophia
    environment:
      OPENAI_API_BASE_URL: http://sophia:8765/v1
      OPENAI_API_KEY: ${SOPHIA_REQUESTOR_KEY:?set SOPHIA_REQUESTOR_KEY in .env to the requestor key you create}
      # Point at the host's existing ollama so the UI's "models"
      # list shows local models too (useful fallback while we wire
      # Sophia providers).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Disable auth for the test. Production: WEBUI_AUTH=true +
      # configure an admin user.
      WEBUI_AUTH: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:8080"   # bound to 0.0.0.0 — accessible from the LAN.
                      # The container listens on 8080 internally; the
                      # host-side port is 3000.
    volumes:
      - openwebui_data:/app/backend/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge

volumes:
  sophia_data:
  sophia_logs:
  openwebui_data:
