site_name: Sophia
site_description: OpenAI-compatible gateway over ladyol's provider pool.
site_url: https://www.solutionsbrewer.com/
repo_url: https://github.com/solubrew/sophia
repo_name: solubrew/sophia

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.tracking
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true

nav:
  - Home: README.md
  - Deployment: docs/DEPLOY.md
  - Hermes setup: docs/HERMES_SETUP.md
  - CLI: CLI.md
  - Changelog: CHANGES.md
  - TODOs: TODOs.md

extra:
  generator: false